name: V26 quiz UX rollout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v26-quiz-ux-rollout.yml']
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate and bump build
        run: |
          node --check js/material-bank-core.js
          node --check js/v23-quality-bank.js
          node --check js/generate-progress.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          old='2026.08.22.1036';new='2026.08.22.1042'
          p=Path('index.html');p.write_text(p.read_text().replace(old,new))
          c=Path('js/cache-control.js');x=c.read_text();x=re.sub(r'gbpCacheNotice-20260822-[0-9]+','gbpCacheNotice-20260822-1042',x);c.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/cache-control.js version.json
          git commit -m "Activate concise traps, top quiz navigation, and in-module generation"
          git push
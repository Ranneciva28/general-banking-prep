name: Database resilience rollout
on:
  push:
    paths:
      - '.github/workflows/db-resilience-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('js/v14-db-bank.js'); s=p.read_text()
          old_rpc="async function rpc(name,body){const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${name}`,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text()||name);return r.json()}"
          new_rpc="""async function rpc(name,body){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),7000);
    try{const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${name}`,{method:'POST',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text()||name);return await r.json()}finally{clearTimeout(timer)}
  }"""
          if old_rpc not in s: raise SystemExit('rpc block not found')
          s=s.replace(old_rpc,new_rpc)

          old_reserve="""  async function reserveNew(mid){
    const used=await dbUsed(mid),shorts=[],longs=[];await reserveKind(mid,used,shorts,SHORT_TARGET,false);await reserveKind(mid,used,longs,LONG_TARGET,true);
    if(shorts.length!==SHORT_TARGET||longs.length!==LONG_TARGET)throw new Error(`unique-mix-${shorts.length}-${longs.length}`);
    const active=[...shorts,...longs];saveState(mid,{active,synced:true,updatedAt:Date.now()});replaceModule(mid,active);return active;
  }
  async function ensureModule(mid){const st=getState(mid);if(st.synced&&st.active.length===ACTIVE_LIMIT){replaceModule(mid,st.active);return st.active}return reserveNew(mid)}"""
          new_reserve="""  function localFallback(mid,used=new Set()){
    const shorts=[],longs=[],start=((mid*223+Date.now())%BANK_SIZE)+1;
    for(let i=0;i<BANK_SIZE&&(shorts.length<SHORT_TARGET||longs.length<LONG_TARGET);i++){
      const slot=((start-1+i*109)%BANK_SIZE)+1;if(used.has(slot))continue;
      const q=question(mid,slot);if(!q)continue;
      const target=isLongSlot(slot)?longs:shorts,need=isLongSlot(slot)?LONG_TARGET:SHORT_TARGET;
      if(target.length<need)target.push(slot);
    }
    const active=[...shorts,...longs];
    if(active.length<ACTIVE_LIMIT){for(const slot of previewSlots(mid)){if(!active.includes(slot))active.push(slot);if(active.length===ACTIVE_LIMIT)break}}
    saveState(mid,{active,synced:false,updatedAt:Date.now()});replaceModule(mid,active);return active;
  }
  async function reserveNew(mid){
    let used=new Set();
    try{
      used=await dbUsed(mid);const shorts=[],longs=[];
      await reserveKind(mid,used,shorts,SHORT_TARGET,false);await reserveKind(mid,used,longs,LONG_TARGET,true);
      if(shorts.length===SHORT_TARGET&&longs.length===LONG_TARGET){const active=[...shorts,...longs];saveState(mid,{active,synced:true,updatedAt:Date.now()});replaceModule(mid,active);return active}
      return localFallback(mid,used);
    }catch(e){console.warn('Question DB fallback',e);return localFallback(mid,used)}
  }
  async function ensureModule(mid){const st=getState(mid);if(st.active.length===ACTIVE_LIMIT){replaceModule(mid,st.active);if(!st.synced)reserveNew(mid).catch(()=>{});return st.active}return reserveNew(mid)}"""
          if old_reserve not in s: raise SystemExit('reserve block not found')
          s=s.replace(old_reserve,new_reserve)

          s=s.replace("toast('Belum tersedia 50 soal yang lolos filter uniqueness. Coba lagi.');setBusy(button,false)","toast('Bank soal lokal diaktifkan. Silakan mulai lagi.');setBusy(button,false)")
          s=s.replace("toast('Koneksi bank soal database gagal. Silakan coba lagi.')","toast('Bank soal lokal digunakan sementara. Quiz tetap bisa dilanjutkan.')")
          p.write_text(s)

          old='2026.08.21.1944'; new='2026.08.21.2012'
          i=Path('index.html'); i.write_text(i.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Make quiz resilient to database reservation failures"
          git push
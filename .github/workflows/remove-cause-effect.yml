name: Remove cause effect questions
on:
  push:
    paths:
      - '.github/workflows/remove-cause-effect.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('js/v14-db-bank.js'); s=p.read_text()
          s=s.replace("const typeFor=slot=>{const x=hash(`type-v14:${slot}`)%100;return x<45?'normal':x<65?'except':x<80?'cause':'case'};",
                      "const typeFor=slot=>{const x=hash(`type-v14:${slot}`)%100;return x<55?'normal':x<75?'except':'case'};")
          s=re.sub(r"\n  function causeQ\(base,mid,slot\)\{.*?\n  \}\n\n  function caseQ", "\n  function caseQ", s, flags=re.S)
          s=s.replace("let q=t==='long'?longQ(base,mid,slot):t==='normal'?normalQ(base,mid,slot):t==='except'?exceptQ(base,mid,slot):t==='cause'?causeQ(base,mid,slot):caseQ(base,mid,slot);",
                      "let q=t==='long'?longQ(base,mid,slot):t==='normal'?normalQ(base,mid,slot):t==='except'?exceptQ(base,mid,slot):caseQ(base,mid,slot);")
          p.write_text(s)

          old='2026.08.21.1859'; new='2026.08.21.1907'
          i=Path('index.html'); i.write_text(i.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Remove cause-effect question pattern globally"
          git push
name: Remove page cache slugs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-page-cache-slugs.yml']
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove cache params from page URL
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          old="""      window.__GBP_BUILD__=BUILD;
      (async()=>{
        try{
          const res=await fetch(`version.json?t=${Date.now()}`,{cache:'no-store'});
          const remote=await res.json();
          const live=remote?.build||BUILD;
          if(localStorage.getItem(KEY)!==live){
            await clearRuntime();
            localStorage.setItem(KEY,live);
            const u=new URL(location.href);
            if(u.searchParams.get('_build')!==live){u.searchParams.set('_build',live);location.replace(u.toString());}
          }
        }catch(e){
          if(localStorage.getItem(KEY)!==BUILD){clearRuntime();localStorage.setItem(KEY,BUILD);}
        }
      })();"""
          new="""      window.__GBP_BUILD__=BUILD;
      try{
        const u=new URL(location.href);
        let changed=false;
        ['_build','_cache','_ts','_manualclear'].forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true;}});
        if(changed)history.replaceState(history.state,'',`${u.pathname}${u.search}${u.hash}`);
      }catch(e){}
      (async()=>{
        try{
          const res=await fetch(`version.json?t=${Date.now()}`,{cache:'no-store'});
          const remote=await res.json();
          const live=remote?.build||BUILD;
          if(localStorage.getItem(KEY)!==live){
            await clearRuntime();
            localStorage.setItem(KEY,live);
            location.reload();
          }
        }catch(e){
          if(localStorage.getItem(KEY)!==BUILD){await clearRuntime();localStorage.setItem(KEY,BUILD);location.reload();}
        }
      })();"""
          if old not in s:
            raise SystemExit('target cache bootstrap block not found')
          s=s.replace(old,new)
          s=s.replace('2026.08.22.1036','2026.08.22.1055')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':'2026.08.22.1055','forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Keep cache busting out of the page URL"
          git push
# trigger
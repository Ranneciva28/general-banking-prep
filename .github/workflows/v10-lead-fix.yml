name: V10 lead uniqueness fix
on:
  push:
    paths:
      - '.github/workflows/v10-lead-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          js=Path('js/v10-db-bank.js'); s=js.read_text()
          needle="  const moduleName=mid=>pool(mid)[0]?.moduleName||`Module ${mid}`;\n"
          addition="""  const moduleTags={1:'Peran-Bank',2:'Dana',3:'Kredit',4:'Regulasi',5:'Ecosystem',6:'Future-Banking',7:'Info-Produk',8:'Edukasi',9:'Pengaduan',10:'Rekening',11:'Transaksi',12:'Administrasi',13:'Valas',14:'Trade-Finance',15:'Akuntansi-Perusahaan',16:'Akuntansi-Bank',17:'Risk-Culture',18:'Anti-Fraud',19:'BCM-K3',20:'PDP',21:'KYC',22:'Hukum',23:'Three-Lines',24:'APU-PPT',25:'BRIDGE',26:'NUPMK-Info-Produk',27:'NUPMK-Edukasi',28:'NUPMK-Pengaduan',29:'NUPMK-Rekening',30:'NUPMK-Transaksi',31:'NUPMK-Administrasi',32:'NUPMK-Valas',33:'NUPMK-Trade',34:'NUPMK-Akuntansi',35:'NUPMK-Hukum'};\n  const moduleTag=mid=>moduleTags[mid]||moduleName(mid);\n"""
          if 'const moduleTags=' not in s:
              s=s.replace(needle,needle+addition)
          s=s.replace("return `${a} ${b} ${c} terkait ${moduleName(mid)}.`;","return `${a} ${b} pada ${moduleTag(mid)} ${c}.`;")
          js.write_text(s)
          old='2026.08.21.1615'; new='2026.08.21.1628'
          p=Path('index.html'); p.write_text(p.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v10-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Guarantee distinct question leads across modules"
          git push
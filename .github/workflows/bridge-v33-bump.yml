name: BRIDGE V33 production cache bump
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bridge-v33-bump.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.24.1516-bridge-units-v32'
          new='2026.08.24.1532-bridge-units-v33'
          p=Path('index.html'); p.write_text(p.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True,'assetVersion':new},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Activate BRIDGE full and competency submodules"
          git push

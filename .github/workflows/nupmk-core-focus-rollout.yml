name: NUPMK core focus rollout
on:
  push:
    paths:
      - '.github/workflows/nupmk-core-focus-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1907'; new='2026.08.21.1925'
          p=Path('index.html'); p.write_text(p.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Bump build for NUPMK core competency alignment"
          git push
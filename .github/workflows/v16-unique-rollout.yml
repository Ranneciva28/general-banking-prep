# retrigger
name: V16 duplicate-free rollout
on:
  push:
    paths:
      - '.github/workflows/v16-unique-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1925'; new='2026.08.21.2247'
          p=Path('index.html'); s=p.read_text().replace(old,new)
          if 'v16-source-variants.js' not in s:
            s=s.replace(f'<script src="js/v14-db-bank.js?v={new}"></script>',f'<script src="js/v16-source-variants.js?v={new}"></script>\n  <script src="js/v14-db-bank.js?v={new}"></script>\n  <script src="js/v16-dedupe.js?v={new}"></script>')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Activate strict duplicate-free question bank"
          git push
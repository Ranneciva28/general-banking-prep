name: V9 category rollout
on:
  push:
    paths:
      - '.github/workflows/v9-category-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1408'; new='2026.08.21.1418'
          p=Path('index.html'); s=p.read_text()
          s=s.replace(old,new)
          bridge=f'<script src="js/bridge-module.js?v={new}"></script>'
          if 'js/bridge-category.js' not in s:
              s=s.replace(bridge, bridge+f'\n  <script src="js/bridge-category.js?v={new}"></script>')
          s=s.replace(f'  <script src="js/v8-global-no-repeat.js?v={new}"></script>\n','')
          s=s.replace(f'  <script src="js/v7-no-repeat.js?v={new}"></script>\n','')
          if 'js/v9-global-unique.js' not in s:
              s=s.replace(f'<script src="js/v5-patch.js?v={new}"></script>',f'<script src="js/v5-patch.js?v={new}"></script>\n  <script src="js/v9-global-unique.js?v={new}"></script>')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Activate BRIDGE category and V9 global unique bank"
          git push

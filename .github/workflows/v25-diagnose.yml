name: V25 diagnose
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v25-diagnose.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build report
        run: |
          cat > /tmp/report.js <<'NODE'
          const storage={};global.window={QUESTION_BANK:[]};global.localStorage={getItem:k=>storage[k]??null,setItem:(k,v)=>storage[k]=String(v),removeItem:k=>delete storage[k]};global.sessionStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};global.crypto=require('crypto').webcrypto;global.document={addEventListener:()=>{},querySelector:()=>null,querySelectorAll:()=>[],getElementById:()=>null,referrer:'',createElement:()=>({})};global.location={reload(){},pathname:'/'};global.navigator={userAgent:'diag',language:'id-ID'};global.screen={width:1,height:1};global.fetch=async()=>({ok:true,text:async()=>'',json:async()=>({accepted_count:25})});
          require(process.cwd()+'/js/questions.js');require(process.cwd()+'/js/material-bank-core.js');require(process.cwd()+'/js/material-bank-d1.js');require(process.cwd()+'/js/material-bank-d2.js');require(process.cwd()+'/js/material-bank-d3.js');require(process.cwd()+'/js/material-bank-d4d5.js');require(process.cwd()+'/js/material-bank-extra.js');require(process.cwd()+'/js/bridge-module.js');require(process.cwd()+'/js/bridge-category.js');require(process.cwd()+'/js/nupmk-modules.js');require(process.cwd()+'/js/v23-quality-bank.js');
          const bank=window.__GBP_SOURCE_BANK__||[];for(let m=1;m<=35;m++){const r=bank.filter(q=>Number(q.moduleId)===m);console.log(`M${String(m).padStart(2,'0')} rows=${r.length} roots=${new Set(r.map(q=>q.rootQuestionId||q.baseId||q.id)).size}`)}
          NODE
          node /tmp/report.js > v25-audit.txt
          cat v25-audit.txt
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v25-audit.txt;git commit -m "Publish V25 source count diagnostic";git push

name: Frozen boot loading rollout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/boot-loading-rollout.yml']
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add boot freeze overlay and progress bar
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.22.1055';new='2026.08.22.1105'
          p=Path('index.html');s=p.read_text()
          boot_style='''\n  <style id="bootLoadingCriticalCss">\n    html.gbp-booting,html.gbp-booting body{overflow:hidden!important}\n    html.gbp-booting .app-layout{filter:blur(9px);transform:scale(1.004);pointer-events:none!important;user-select:none!important}\n    #bootLoadingOverlay{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:1;transition:opacity .22s ease}\n    #bootLoadingOverlay[hidden]{display:none!important}\n    #bootLoadingOverlay.gbp-boot-done{opacity:0}\n    .boot-loading-card{width:min(440px,calc(100vw - 40px));background:rgba(255,255,255,.97);border:1px solid rgba(226,232,240,.9);border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(15,23,42,.28);color:#0f172a}\n    .boot-loading-kicker{font-size:11px;font-weight:800;letter-spacing:.11em;color:#2454e6;margin-bottom:8px}\n    .boot-loading-title{font-size:20px;font-weight:800;line-height:1.3;margin:0 0 7px}\n    .boot-loading-status{font-size:13px;line-height:1.5;color:#64748b;min-height:20px}\n    .boot-loading-row{display:flex;align-items:center;gap:12px;margin-top:18px}\n    .boot-loading-track{height:9px;flex:1;background:#e8edf7;border-radius:999px;overflow:hidden}\n    .boot-loading-bar{height:100%;width:8%;background:#2454e6;border-radius:inherit;transition:width .18s ease}\n    .boot-loading-pct{width:42px;text-align:right;font-size:12px;font-weight:800;color:#2454e6}\n    .boot-loading-retry{display:block;width:100%;margin-top:14px;border:1px solid #cbd5e1;background:#fff;color:#2454e6;border-radius:11px;padding:10px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}\n  </style>\n  <script>document.documentElement.classList.add('gbp-booting');</script>'''
          if 'bootLoadingCriticalCss' not in s:
            s=s.replace('  <title>General Banking Prep</title>','  <title>General Banking Prep</title>'+boot_style)
          overlay='''\n  <div id="bootLoadingOverlay" role="status" aria-live="polite" aria-hidden="false">\n    <div class="boot-loading-card">\n      <div class="boot-loading-kicker">GENERAL BANKING PREP</div>\n      <div class="boot-loading-title">Loading your learning workspace</div>\n      <div class="boot-loading-status" id="bootLoadingStatus">Loading application....</div>\n      <div class="boot-loading-row">\n        <div class="boot-loading-track"><div class="boot-loading-bar" id="bootLoadingBar"></div></div>\n        <div class="boot-loading-pct" id="bootLoadingPct">8%</div>\n      </div>\n      <button class="boot-loading-retry" id="bootLoadingRetry" type="button" hidden>Reload safely</button>\n    </div>\n  </div>'''
          if 'id="bootLoadingOverlay"' not in s:
            s=s.replace('<body>','<body>'+overlay,1)
          if 'js/boot-loading.js' not in s:
            needle=f'  <script src="js/nupmk-ui.js?v={old}"></script>'
            s=s.replace(needle,needle+f'\n  <script src="js/boot-loading.js?v={new}"></script>')
          s=s.replace(old,new)
          p.write_text(s)

          c=Path('js/cache-control.js');x=c.read_text()
          x=x.replace("if(local!==remote){await clearQuestionCache();localStorage.setItem(EPOCH_KEY,remote);location.reload()}","if(local!==remote){window.GBPBootLoading?.show('Refreshing learning data, please wait....');await clearQuestionCache();localStorage.setItem(EPOCH_KEY,remote);location.reload()}")
          x=x.replace("const b=e.currentTarget;b.disabled=true;b.textContent='Clearing cache…';await clearQuestionCache();sessionStorage.setItem(key,'1');location.reload()","const b=e.currentTarget;b.disabled=true;b.textContent='Clearing cache…';window.GBPBootLoading?.show('Clearing cache and restoring your workspace....');await clearQuestionCache();sessionStorage.setItem(key,'1');location.reload()")
          x=x.replace('gbpCacheNotice-20260822-0930','gbpCacheNotice-20260822-1105')
          c.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          node --check js/boot-loading.js
          node --check js/cache-control.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/cache-control.js version.json
          git commit -m "Freeze UI behind a loading progress bar during restore"
          git push

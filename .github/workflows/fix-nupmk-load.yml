# retrigger
name: Fix NUPMK database load
on:
  push:
    paths:
      - '.github/workflows/fix-nupmk-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('js/v14-db-bank.js')
          s=p.read_text()
          insert="""
  const NUPMK_FOCUS_LEADS={
    26:['Saat nasabah meminta informasi produk,','Dalam penyampaian informasi produk,','Ketika fitur produk dijelaskan,','Pada saat manfaat produk diterangkan,','Dalam pelayanan informasi kepada nasabah,'],
    27:['Saat melakukan edukasi kepada nasabah,','Dalam kegiatan edukasi keuangan,','Ketika menjelaskan pemahaman produk kepada nasabah,','Pada saat memberikan edukasi,','Dalam proses membangun pemahaman nasabah,'],
    28:['Saat menangani pengaduan nasabah,','Dalam proses penyelesaian pengaduan,','Ketika keluhan nasabah diterima,','Pada saat menindaklanjuti pengaduan,','Dalam penanganan keluhan nasabah,'],
    29:['Saat memproses pembukaan rekening,','Dalam proses penutupan rekening,','Ketika data rekening diproses,','Pada tahap pembukaan atau penutupan rekening,','Dalam administrasi pembukaan rekening,'],
    30:['Saat memproses transaksi nasabah,','Dalam transaksi tunai dan non tunai,','Ketika instruksi transaksi diterima,','Pada tahap pemrosesan transaksi,','Dalam pelaksanaan transaksi keuangan,'],
    31:['Dalam pengelolaan administrasi perbankan,','Saat dokumen administrasi diproses,','Ketika administrasi operasional diperiksa,','Pada proses administrasi perbankan,','Dalam pencatatan administrasi operasional,'],
    32:['Saat memproses transaksi valuta asing,','Dalam layanan transaksi valas,','Ketika transaksi mata uang asing diproses,','Pada proses valuta asing,','Dalam pelaksanaan transaksi valas,'],
    33:['Dalam layanan trade service dan trade finance,','Saat dokumen trade diproses,','Ketika transaksi perdagangan internasional diproses,','Pada proses trade finance,','Dalam pelaksanaan layanan trade,'],
    34:['Dalam pencatatan akuntansi,','Saat transaksi dibukukan,','Ketika laporan akuntansi disusun,','Pada proses akuntansi perbankan,','Dalam pengelolaan pencatatan keuangan,'],
    35:['Dalam penanganan aspek hukum perbankan,','Saat dokumen hukum ditelaah,','Ketika ketentuan hukum diterapkan,','Pada proses legal perbankan,','Dalam pengelolaan risiko hukum,']
  };
  function focusedDirect(raw,mid,slot){
    const q=clean(raw);
    if(mid<26||mid>35)return q;
    const leads=NUPMK_FOCUS_LEADS[mid]||[];
    const facet=facetFor(mid,slot);
    if(!leads.length||facet%6===0)return q;
    const lead=leads[facet%leads.length];
    return cap(`${lead} ${q.charAt(0).toLocaleLowerCase('id-ID')+q.slice(1)}`);
  }
"""
          needle="  const facetFor=(mid,slot)=>hash(`facet-v14:${mid}:${slot}`)%64;\n"
          if insert.strip() not in s:
            s=s.replace(needle,needle+insert)
          s=s.replace("if(raw.length<=280&&isDirectPrompt(raw))return {...base,question:cap(raw),questionType:'Pilihan Ganda'};",
                      "if(raw.length<=280&&isDirectPrompt(raw))return {...base,question:focusedDirect(raw,mid,slot),questionType:'Pilihan Ganda'};")
          s=s.replace("if(isDirectPrompt(raw))return {...base,question:cap(raw),questionType:'Analisis Kasus'};",
                      "if(isDirectPrompt(raw))return {...base,question:focusedDirect(raw,mid,slot),questionType:'Analisis Kasus'};")
          s=s.replace("if(isDirectPrompt(raw)&&raw.length<=500)return {...base,question:cap(raw),questionType:'Analisis Kasus'};",
                      "if(isDirectPrompt(raw)&&raw.length<=500)return {...base,question:focusedDirect(raw,mid,slot),questionType:'Analisis Kasus'};")
          s=s.replace("const structureKey=`${conceptKey(base)}|${q.questionType}|${kind}|facet-${facet}`;",
                      "const structureKey=`module-${mid}|${conceptKey(base)}|${q.questionType}|${kind}|facet-${facet}`;")
          s=s.replace("toast('Koneksi bank soal database gagal. Silakan coba lagi.')",
                      "toast('Bank soal belum berhasil disiapkan. Silakan coba lagi.')")
          p.write_text(s)

          old='2026.08.21.1925'; new='2026.08.21.1944'
          i=Path('index.html'); i.write_text(i.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Fix NUPMK unique question reservation"
          git push
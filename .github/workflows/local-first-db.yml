name: Local-first duplicate-safe bank
on:
  push:
    paths:
      - '.github/workflows/local-first-db.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('js/v14-db-bank.js'); s=p.read_text()
          old="""  async function reserveNew(mid){
    const used=await dbUsed(mid),shorts=[],longs=[];await reserveKind(mid,used,shorts,SHORT_TARGET,false);await reserveKind(mid,used,longs,LONG_TARGET,true);
    if(shorts.length!==SHORT_TARGET||longs.length!==LONG_TARGET)throw new Error(`unique-mix-${shorts.length}-${longs.length}`);
    const active=[...shorts,...longs];saveState(mid,{active,synced:true,updatedAt:Date.now()});replaceModule(mid,active);return active;
  }
  async function ensureModule(mid){const st=getState(mid);if(st.synced&&st.active.length===ACTIVE_LIMIT){replaceModule(mid,st.active);return st.active}return reserveNew(mid)}"""
          new="""  const LOCAL_SEEN_KEY='gbpQuestionTextSeenV17';
  const textKey=q=>lower(q?.question||'').replace(/[^a-z0-9à-öø-ÿ]+/giu,' ').replace(/\\s+/g,' ').trim();
  let localSeen={};try{localSeen=JSON.parse(localStorage.getItem(LOCAL_SEEN_KEY)||'{}')||{}}catch(e){localSeen={}}
  function saveSeen(){try{const rows=Object.entries(localSeen).sort((a,b)=>b[1]-a[1]).slice(0,15000);localSeen=Object.fromEntries(rows);localStorage.setItem(LOCAL_SEEN_KEY,JSON.stringify(localSeen))}catch(e){}}
  function pickLocalUnique(mid){
    const shorts=[],longs=[],textSet=new Set(),start=1+Math.floor(Math.random()*BANK_SIZE),step=109;
    const take=(ignoreHistory=false)=>{
      for(let i=0;i<BANK_SIZE&&(shorts.length<SHORT_TARGET||longs.length<LONG_TARGET);i++){
        const slot=((start-1+i*step)%BANK_SIZE)+1,q=question(mid,slot);if(!q)continue;
        const k=textKey(q);if(!k||textSet.has(k)||(!ignoreHistory&&localSeen[k]))continue;
        const target=isLongSlot(slot)?longs:shorts,need=isLongSlot(slot)?LONG_TARGET:SHORT_TARGET;
        if(target.length>=need)continue;textSet.add(k);target.push(slot);
      }
    };
    take(false);if(shorts.length<SHORT_TARGET||longs.length<LONG_TARGET)take(true);
    const active=[...shorts,...longs];
    if(active.length<ACTIVE_LIMIT){
      for(const slot of previewSlots(mid)){
        const q=question(mid,slot),k=textKey(q);if(!q||!k||textSet.has(k))continue;
        textSet.add(k);active.push(slot);if(active.length===ACTIVE_LIMIT)break;
      }
    }
    for(const slot of active){const q=question(mid,slot),k=textKey(q);if(k)localSeen[k]=Date.now()}
    saveSeen();saveState(mid,{active,synced:false,updatedAt:Date.now()});replaceModule(mid,active);return active;
  }
  async function syncActive(mid,active){
    try{await rpc('gbp_question_register_batch',{p_client_id:clientId,p_module_id:mid,p_questions:payload(mid,active),p_requested_count:Math.min(50,active.length)});saveState(mid,{active,synced:true,updatedAt:Date.now()})}catch(e){console.warn('Background DB sync skipped',e)}
  }
  async function reserveNew(mid){
    const active=pickLocalUnique(mid);
    setTimeout(()=>syncActive(mid,active),0);
    return active;
  }
  async function ensureModule(mid){
    const st=getState(mid);
    if(st.active.length===ACTIVE_LIMIT){
      const seen=new Set();let valid=true;
      for(const slot of st.active){const q=question(mid,slot),k=textKey(q);if(!k||seen.has(k)){valid=false;break}seen.add(k)}
      if(valid){replaceModule(mid,st.active);if(!st.synced)setTimeout(()=>syncActive(mid,st.active),0);return st.active}
    }
    return reserveNew(mid)
  }"""
          if old not in s: raise SystemExit('reserve block not found')
          s=s.replace(old,new)
          s=s.replace("toast('Belum tersedia 50 soal yang lolos filter uniqueness. Coba lagi.');setBusy(button,false)","const active=pickLocalUnique(mid);if(active.length){clearProgress(mid);sessionStorage.setItem('gbpAutoOpenModule',String(mid));location.reload()}else{toast('Bank soal lokal belum dapat disiapkan.');setBusy(button,false)}")
          s=s.replace("toast('Koneksi bank soal database gagal. Silakan coba lagi.')","toast('Bank soal lokal digunakan. Sinkronisasi database berjalan di belakang layar.')")
          p.write_text(s)

          i=Path('index.html'); x=i.read_text(); oldb='2026.08.21.2247'; newb='2026.08.21.2310';x=x.replace(oldb,newb)
          if 'update-notice.js' not in x:x=x.replace(f'<script src="js/cache-control.js?v={newb}"></script>',f'<script src="js/cache-control.js?v={newb}"></script>\n  <script src="js/update-notice.js?v={newb}"></script>')
          i.write_text(x)
          Path('version.json').write_text(json.dumps({'build':newb,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Decouple quiz loading from database and enforce unique stems"
          git push
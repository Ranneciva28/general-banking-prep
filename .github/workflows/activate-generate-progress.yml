name: Activate generate progress notification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-generate-progress.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add progress loader and bump build
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.22.0930'; new='2026.08.22.1036'
          p=Path('index.html'); s=p.read_text()
          needle=f'  <script src="js/v23-quality-bank.js?v={old}"></script>\n'
          line=f'  <script src="js/generate-progress.js?v={new}"></script>\n'
          if 'js/generate-progress.js' not in s:
              s=s.replace(needle, needle+line)
          s=s.replace(old,new)
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          node --check js/generate-progress.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Show progress while generating questions"
          git push

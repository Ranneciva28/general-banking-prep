name: Final V18 cache bump
on:
  push:
    paths:
      - '.github/workflows/v18-final-bump.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.2355'; new='2026.08.21.2405'
          p=Path('index.html'); p.write_text(p.read_text().replace(old,new))
          c=Path('js/cache-control.js'); c.write_text(c.read_text().replace('gbpCacheNotice-20260821-2355','gbpCacheNotice-20260821-2405'))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/cache-control.js version.json
          git diff --cached --quiet || git commit -m "Force final V18 unique-bank refresh"
          git push
name: V14 remove complex questions
on:
  push:
    paths:
      - '.github/workflows/v14-remove-complex.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          src=Path('js/v13-db-bank.js').read_text()
          s=src.replace("const STATE_KEY='gbpDbBankV13';","const STATE_KEY='gbpDbBankV14';")
          s=s.replace("type-v13:","type-v14:").replace("facet-v13:","facet-v14:").replace("base-v13:","base-v14:").replace("case-v13:","case-v14:")
          s=s.replace("const typeFor=slot=>{const x=hash(`type-v14:${slot}`)%100;return x<38?'normal':x<55?'except':x<70?'cause':x<85?'complex':'case'};",
                      "const typeFor=slot=>{const x=hash(`type-v14:${slot}`)%100;return x<45?'normal':x<65?'except':x<80?'cause':'case'};")
          s=s.replace("let q=t==='long'?longQ(base,mid,slot):t==='normal'?normalQ(base,mid,slot):t==='except'?exceptQ(base,mid,slot):t==='cause'?causeQ(base,mid,slot):t==='complex'?complexQ(base,mid,slot):caseQ(base,mid,slot);",
                      "let q=t==='long'?longQ(base,mid,slot):t==='normal'?normalQ(base,mid,slot):t==='except'?exceptQ(base,mid,slot):t==='cause'?causeQ(base,mid,slot):caseQ(base,mid,slot);")
          s=s.replace('DB-M${mid}-V13-S${slot}','DB-M${mid}-V14-S${slot}')
          s=s.replace("engine:'v13'","engine:'v14'")
          s=s.replace("engine:'v13'","engine:'v14'")
          # Remove the unused complexQ function entirely.
          s=re.sub(r"\n  function complexQ\(base,mid,slot\)\{.*?\n  \}\n\n  function caseQ", "\n  function caseQ", s, flags=re.S)
          Path('js/v14-db-bank.js').write_text(s)

          old='2026.08.21.1812'; new='2026.08.21.1848'
          p=Path('index.html'); x=p.read_text().replace(old,new).replace('js/v13-db-bank.js','js/v14-db-bank.js');p.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Remove statement-combination question type"
          git push
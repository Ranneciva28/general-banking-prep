name: NUPMK cache bump
on:
  push:
    paths:
      - '.github/workflows/nupmk-cache-bump.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1358'; new='2026.08.21.1408'
          p=Path('index.html'); s=p.read_text().replace(old,new); p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Bump build for expanded NUPMK modules"
          git push

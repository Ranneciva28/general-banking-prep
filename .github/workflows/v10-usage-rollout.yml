name: V10 usage rollout
on:
  push:
    paths:
      - '.github/workflows/v10-usage-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1602'; new='2026.08.21.1615'
          p=Path('index.html'); s=p.read_text().replace(old,new)
          marker=f'<script src="js/app.js?v={new}"></script>'
          if 'js/v10-usage-watch.js' not in s:
              s=s.replace(marker,marker+f'\n  <script src="js/v10-usage-watch.js?v={new}"></script>')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Track displayed questions in Supabase bank"
          git push
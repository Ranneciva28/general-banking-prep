name: Lite cache bump
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lite-cache-bump.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump production build
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.22.1140';new='2026.08.22.1145'
          p=Path('index.html');p.write_text(p.read_text().replace(old,new))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json;git commit -m "Bump lite NUPMK BRIDGE production cache";git push

name: V12 quality hardening
on:
  push:
    paths:
      - '.github/workflows/v12-quality-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/v12-db-bank.js'); s=p.read_text()
          s=s.replace("    const p=pool(mid);if(!p.length)return null;\n    const seed=hash(`base-v12:${mid}:${slot}`);\n    return p[Math.floor(rnd(seed,11)*p.length)%p.length];",
          "    const all=pool(mid);if(!all.length)return null;\n    const eligible=isLongSlot(slot)?all:all.filter(q=>{const raw=clean(q.question),f=firstSentence(raw);return raw.length<=190||(f.length>=24&&f.length<=190)});\n    const p=eligible.length?eligible:all;\n    const seed=hash(`base-v12:${mid}:${slot}`);\n    return p[Math.floor(rnd(seed,11)*p.length)%p.length];")
          s=s.replace("    return {...q,id:`DB-M${mid}-V12-S${slot}`,source:`${base.source} · DB Bank ${slot}/${BANK_SIZE}`,generated:true,bankSlot:slot,bankEpoch:1,baseId:base.id,isLong:isLongSlot(slot)};",
          "    const kind=isLongSlot(slot)?'long':'short',facet=facetFor(mid,slot);\n    const structureKey=`${conceptKey(base)}|${q.questionType}|${kind}|facet-${facet}`;\n    return {...q,id:`DB-M${mid}-V12-S${slot}`,source:`${base.source} · DB Bank ${slot}/${BANK_SIZE}`,generated:true,bankSlot:slot,bankEpoch:1,baseId:base.id,isLong:isLongSlot(slot),structureKey};")
          s=s.replace("      if(isLongSlot(s)!==longFlag||used.has(s)||attempted.has(s))continue;\n      attempted.add(s);out.push(s);",
          "      if(isLongSlot(s)!==longFlag||used.has(s)||attempted.has(s))continue;\n      const q=question(Number(document.getElementById('moduleTag')?.dataset?.moduleId||0)||0,s);\n      attempted.add(s);out.push(s);")
          # Replace candidate helper with module-aware, length-gated version.
          old="""  function candidates(used,attempted,longFlag,limit=240){
    const out=[],start=1+Math.floor(Math.random()*BANK_SIZE),step=103;
    for(let i=0;i<BANK_SIZE&&out.length<limit;i++){
      const s=((start-1+i*step)%BANK_SIZE)+1;
      if(isLongSlot(s)!==longFlag||used.has(s)||attempted.has(s))continue;
      const q=question(Number(document.getElementById('moduleTag')?.dataset?.moduleId||0)||0,s);
      attempted.add(s);out.push(s);
    }
    return out;
  }
"""
          new="""  function candidates(mid,used,attempted,longFlag,limit=240){
    const out=[],start=1+Math.floor(Math.random()*BANK_SIZE),step=103;
    for(let i=0;i<BANK_SIZE&&out.length<limit;i++){
      const slot=((start-1+i*step)%BANK_SIZE)+1;
      if(isLongSlot(slot)!==longFlag||used.has(slot)||attempted.has(slot))continue;
      attempted.add(slot);
      const q=question(mid,slot);if(!q)continue;
      if(!longFlag&&clean(q.question).length>280)continue;
      out.push(slot);
    }
    return out;
  }
"""
          if old not in s: raise SystemExit('candidate block not found')
          s=s.replace(old,new)
          s=s.replace("const cand=candidates(used,attempted,longFlag,240);","const cand=candidates(mid,used,attempted,longFlag,240);")
          s=s.replace("function payload(mid,slots){return slots.map(s=>{const q=question(mid,s),base=baseFor(mid,s),facet=facetFor(mid,s),kind=q.isLong?'long':'short';return{slot:s,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation,source:q.source,baseId:q.baseId,questionType:q.questionType,difficulty:q.difficulty,structureKey:`${conceptKey(base)}|${q.questionType}|${kind}|facet-${facet}`}})}",
          "function payload(mid,slots){return slots.map(s=>{const q=question(mid,s);return{slot:s,question:q.question,options:q.options,answer:q.answer,explanation:q.explanation,source:q.source,baseId:q.baseId,questionType:q.questionType,difficulty:q.difficulty,structureKey:q.structureKey}})}")
          p.write_text(s)

          w=Path('js/v10-usage-watch.js'); u=w.read_text()
          u=u.replace("questionType:q.questionType||'Pilihan Ganda',difficulty:q.difficulty||'Sedang-Sulit'",
                      "questionType:q.questionType||'Pilihan Ganda',difficulty:q.difficulty||'Sedang-Sulit',structureKey:q.structureKey||`${clean(q.question)}|${q.questionType||'Pilihan Ganda'}|shown`")
          w.write_text(u)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v12-db-bank.js js/v10-usage-watch.js
          git diff --cached --quiet || git commit -m "Enforce short-question limit and tracked uniqueness"
          git push
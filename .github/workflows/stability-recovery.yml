name: Lightweight stability recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stability-recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redirect cache bootstrap and refresh stable assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          start=s.index("  <script>\n    (()=>{\n      const BUILD=")
          end=s.index("  </script>",start)+len("  </script>")
          replacement="""  <script>
    (()=>{
      const BUILD='2026.08.22.1037';
      window.__GBP_BUILD__=BUILD;
      try{
        const u=new URL(location.href);
        let changed=false;
        ['_build','_cache','_ts','_manualclear'].forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true;}});
        if(changed)history.replaceState(history.state,'',`${u.pathname}${u.search}${u.hash}`);
      }catch(e){}
    })();
  </script>"""
          s=s[:start]+replacement+s[end:]
          s=s.replace('2026.08.22.1036','2026.08.22.1037')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':'2026.08.22.1037','forceCacheReset':False},separators=(',',':')))
          PY
          grep -q "const BUILD='2026.08.22.1037'" index.html
          grep -q "cache-control.js?v=2026.08.22.1037" index.html
          if grep -q "location.replace" index.html; then echo 'location.replace still present in index' && exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Restore fast startup without redirect cache bootstrap"
          git push

name: V23 production cache rollout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v23-production-rollout.yml'
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump build and refresh notice
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.2405'; new='2026.08.22.0840'
          p=Path('index.html'); s=p.read_text().replace(old,new); p.write_text(s)
          c=Path('js/cache-control.js'); x=c.read_text()
          x=x.replace('gbpCacheNotice-20260821-2405','gbpCacheNotice-20260822-0840')
          x=x.replace('Bank soal diperbarui ke 25 soal per generate dengan proteksi stem dan opsi duplikat.', 'Bank soal HOTS terbaru aktif: 25 soal per generate dengan kasus kontekstual serta proteksi stem, opsi, dan konsep duplikat.')
          c.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/cache-control.js version.json
          git commit -m "Activate audited HOTS bank build 2026.08.22.0840"
          git push
name: V24 concise question rollout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v23-static-bank-rollout.yml'
permissions:
  contents: write
jobs:
  concise-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade selector for concise variants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/v14-db-bank.js')
          s=p.read_text()
          swaps={
            "const STATE_KEY='gbpDbBankV20';":"const STATE_KEY='gbpDbBankV24';",
            "const LOCAL_SEEN_KEY='gbpQuestionSeenV20';":"const LOCAL_SEEN_KEY='gbpQuestionSeenV24';",
            "const mk='gbpHotsSelectorV20b';if(!localStorage.getItem(mk)){localStorage.removeItem('gbpDbBankV14');localStorage.removeItem(STATE_KEY);state={};localStorage.setItem(mk,'1')":"const mk='gbpConciseSelectorV24';if(!localStorage.getItem(mk)){localStorage.removeItem('gbpDbBankV14');localStorage.removeItem('gbpDbBankV20');localStorage.removeItem('gbpQuestionSeenV20');localStorage.removeItem(STATE_KEY);state={};localStorage.setItem(mk,'1')",
            "id:base.id||`V20-M${mid}-S${slot}`,bankSlot:Number(slot),bankEpoch:20":"id:base.id||`V24-M${mid}-S${slot}`,bankSlot:Number(slot),bankEpoch:24",
            "&&!seenStem.has(sk)&&!seenOpt.has(ok)&&!seenSem.has(ck)":"&&!seenStem.has(sk)&&!seenSem.has(ck)",
            "(localSeen['q:'+sk]||localSeen['o:'+ok]||localSeen['c:'+ck])":"(localSeen['q:'+sk]||localSeen['c:'+ck])",
            "engine:'v20-hots-direct'":"engine:'v24-concise-grounded'",
            "'25 soal HOTS baru aktif. Stem, opsi, dan konsep diprioritaskan belum pernah tampil.'":"'25 soal ringkas berbasis materi aktif. Stem dan konsep diprioritaskan belum pernah tampil.'",
            "Generate 25 soal HOTS baru? Sistem akan memprioritaskan stem, opsi, konsep, dan root question yang belum pernah tampil.":"Generate 25 soal ringkas baru? Sistem akan memprioritaskan stem dan konsep yang belum pernah tampil.",
            "meta:{databaseBank:true,engine:'v24-concise-grounded',noRepeat:true,uniqueStem:true,uniqueOptions:true,uniqueConcept:true}":"meta:{databaseBank:true,engine:'v24-concise-grounded',noRepeat:true,uniqueStem:true,uniqueOptions:false,uniqueConcept:true,concise:true}",
            "'Belum tersedia 25 soal unik yang lolos filter kualitas. Coba module lain atau generate kembali.'":"'Belum tersedia 25 soal ringkas yang lolos filter kualitas. Coba generate kembali.'"
          }
          for old,new in swaps.items():
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check js/v14-db-bank.js
          node --check js/v23-quality-bank.js

      - name: Audit concise source bank and 25-question selector
        run: |
          cat > /tmp/audit-concise.js <<'NODE'
          const storage={};
          global.window={QUESTION_BANK:[]};
          global.localStorage={getItem:k=>storage[k]??null,setItem:(k,v)=>storage[k]=String(v),removeItem:k=>delete storage[k]};
          global.sessionStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};
          global.crypto=require('crypto').webcrypto;
          global.document={addEventListener:()=>{},querySelector:()=>null,querySelectorAll:()=>[],getElementById:()=>null,referrer:'',createElement:()=>({})};
          global.location={reload(){},pathname:'/'};
          global.navigator={userAgent:'audit',language:'id-ID'};
          global.screen={width:1440,height:900};
          global.confirm=()=>true;
          global.fetch=async()=>({ok:true,text:async()=>'',json:async()=>({accepted_count:25})});

          require(process.cwd()+'/js/questions.js');
          require(process.cwd()+'/js/bridge-module.js');
          require(process.cwd()+'/js/bridge-category.js');
          require(process.cwd()+'/js/nupmk-modules.js');
          require(process.cwd()+'/js/v23-quality-bank.js');

          const bank=window.__GBP_SOURCE_BANK__||[];
          const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9à-öø-ÿ]+/giu,' ').replace(/\s+/g,' ').trim();
          const banned=/\b(?:pernyataan\s*:|alasan\s*:|sebab\s*[–-]?\s*akibat|pilih pernyataan yang benar|manakah satu pilihan yang benar|pilih jawaban yang paling tepat|pertanyaan acuan)\b/i;
          let fail=false;
          for(let mid=1;mid<=35;mid++){
            const rows=bank.filter(q=>Number(q.moduleId)===mid);
            const stems=new Set(rows.map(q=>norm(q.question)));
            const invalid=rows.filter(q=>!Array.isArray(q.options)||q.options.length!==4||!q.options.includes(q.answer)||!q.question||q.question.length>205||banned.test(q.question));
            console.log(`CONCISE SOURCE M${String(mid).padStart(2,'0')} rows=${rows.length} stems=${stems.size} invalid=${invalid.length} max=${Math.max(0,...rows.map(q=>q.question.length))}`);
            if(rows.length<25||stems.size<25||invalid.length)fail=true;
          }
          if(fail){console.error('CONCISE_SOURCE_AUDIT=FAIL');process.exit(1);}

          window.QUESTION_BANK.splice(0,window.QUESTION_BANK.length,...bank);
          require(process.cwd()+'/js/v14-db-bank.js');
          for(let mid=1;mid<=35;mid++){
            const rows=window.QUESTION_BANK.filter(q=>Number(q.moduleId)===mid);
            const stems=new Set(rows.map(q=>norm(q.question)));
            const roots=new Set(rows.map(q=>String(q.rootQuestionId||q.baseId||q.id)));
            const invalid=rows.filter(q=>q.question.length>205||banned.test(q.question)||!q.options.includes(q.answer));
            console.log(`ACTIVE M${String(mid).padStart(2,'0')} rows=${rows.length} stems=${stems.size} roots=${roots.size} invalid=${invalid.length}`);
            if(rows.length!==25||stems.size!==25||roots.size<Math.min(18,25)||invalid.length)fail=true;
          }
          console.log(fail?'CONCISE_ACTIVE_AUDIT=FAIL':'CONCISE_ACTIVE_AUDIT=PASS');
          process.exit(fail?1:0);
          NODE
          node /tmp/audit-concise.js

      - name: Bump production build and force cache refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          old='2026.08.22.0855'; new='2026.08.22.0856'
          p=Path('index.html'); s=p.read_text().replace(old,new); p.write_text(s)
          c=Path('js/cache-control.js'); x=c.read_text();
          x=re.sub(r'gbpCacheNotice-20260822-[0-9]+','gbpCacheNotice-20260822-0856',x)
          c.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html js/cache-control.js version.json
          git commit -m "Shorten questions while preserving module substance"
          git push

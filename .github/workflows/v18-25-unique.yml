name: V18 25-question distinct rollout
on:
  push:
    paths:
      - '.github/workflows/v18-25-unique.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('js/v14-db-bank.js'); s=p.read_text()
          s=s.replace("const BANK_SIZE=5000, ACTIVE_LIMIT=50, SHORT_TARGET=45, LONG_TARGET=5;","const BANK_SIZE=5000, ACTIVE_LIMIT=25, SHORT_TARGET=22, LONG_TARGET=3;")
          s=s.replace("const isLongSlot=slot=>slot%10===0;","const isLongSlot=slot=>slot%8===0;")
          s=s.replace("const textKey=q=>lower(q?.question||'').replace(/[^a-z0-9à-öø-ÿ]+/giu,' ').replace(/\\s+/g,' ').trim();",
                      "const textKey=q=>lower(q?.question||'').replace(/[^a-z0-9à-öø-ÿ]+/giu,' ').replace(/\\s+/g,' ').trim();\n  const optionKey=q=>(Array.isArray(q?.options)?q.options:[]).map(x=>lower(x).replace(/[^a-z0-9à-öø-ÿ]+/giu,' ').replace(/\\s+/g,' ').trim()).filter(Boolean).sort().join('|');")
          s=s.replace("const target=window.QUESTION_BANK||[],others=target.filter(q=>Number(q.moduleId)!==Number(mid)),seen=new Set(),qs=[];\n    for(const slot of slots){const q=question(mid,slot),k=textKey(q);if(!q||!k||seen.has(k))continue;seen.add(k);qs.push(q)}",
                      "const target=window.QUESTION_BANK||[],others=target.filter(q=>Number(q.moduleId)!==Number(mid)),seen=new Set(),seenOptions=new Set(),qs=[];\n    for(const slot of slots){const q=question(mid,slot),k=textKey(q),ok=optionKey(q);if(!q||!k||!ok||seen.has(k)||seenOptions.has(ok))continue;seen.add(k);seenOptions.add(ok);qs.push(q)}")
          s=s.replace("const shorts=[],longs=[],seen=new Set(),start=((mid*191)%BANK_SIZE)+1;",
                      "const shorts=[],longs=[],seen=new Set(),seenOptions=new Set(),start=((mid*191)%BANK_SIZE)+1;")
          s=s.replace("const s=((start-1+i*107)%BANK_SIZE)+1,q=question(mid,s),k=textKey(q);if(!q||!k||seen.has(k))continue;",
                      "const s=((start-1+i*107)%BANK_SIZE)+1,q=question(mid,s),k=textKey(q),ok=optionKey(q);if(!q||!k||!ok||seen.has(k)||seenOptions.has(ok))continue;")
          s=s.replace("seen.add(k);target.push(s);","seen.add(k);seenOptions.add(ok);target.push(s);")
          s=s.replace("const target=window.QUESTION_BANK||[],next=[],globalSeen=new Set();\n    for(const mid of moduleIds){for(const s of previewSlots(mid)){const q=question(mid,s),k=textKey(q);if(!q||!k||globalSeen.has(k))continue;globalSeen.add(k);next.push(q)}}",
                      "const target=window.QUESTION_BANK||[],next=[],globalSeen=new Set(),globalOptions=new Set();\n    for(const mid of moduleIds){for(const s of previewSlots(mid)){const q=question(mid,s),k=textKey(q),ok=optionKey(q);if(!q||!k||!ok||globalSeen.has(k)||globalOptions.has(ok))continue;globalSeen.add(k);globalOptions.add(ok);next.push(q)}}")
          s=s.replace("const shorts=[],longs=[],seen=new Set(),start=1+Math.floor(Math.random()*BANK_SIZE),step=109;",
                      "const shorts=[],longs=[],seen=new Set(),seenOptions=new Set(),start=1+Math.floor(Math.random()*BANK_SIZE),step=109;")
          s=s.replace("const slot=((start-1+i*step)%BANK_SIZE)+1,q=question(mid,slot),k=textKey(q);if(!q||!k||seen.has(k)||(!ignoreHistory&&localSeen[k]))continue;",
                      "const slot=((start-1+i*step)%BANK_SIZE)+1,q=question(mid,slot),k=textKey(q),ok=optionKey(q);if(!q||!k||!ok||seen.has(k)||seenOptions.has(ok)||(!ignoreHistory&&(localSeen['q:'+k]||localSeen['o:'+ok])))continue;")
          s=s.replace("seen.add(k);target.push(slot);","seen.add(k);seenOptions.add(ok);target.push(slot);")
          s=s.replace("const q=question(mid,s),k=textKey(q);if(!q||!k||seen.has(k))continue;seen.add(k);active.push(s);",
                      "const q=question(mid,s),k=textKey(q),ok=optionKey(q);if(!q||!k||!ok||seen.has(k)||seenOptions.has(ok))continue;seen.add(k);seenOptions.add(ok);active.push(s);")
          s=s.replace("for(const s of active){const k=textKey(question(mid,s));if(k)localSeen[k]=Date.now()}",
                      "for(const s of active){const q=question(mid,s),k=textKey(q),ok=optionKey(q);if(k)localSeen['q:'+k]=Date.now();if(ok)localSeen['o:'+ok]=Date.now()}")
          s=s.replace("p_requested_count:Math.min(50,active.length)","p_requested_count:Math.min(25,active.length)")
          s=s.replace("if(st.active.length===ACTIVE_LIMIT){const seen=new Set();let valid=true;for(const slot of st.active){const k=textKey(question(mid,slot));if(!k||seen.has(k)){valid=false;break}seen.add(k)}",
                      "if(st.active.length===ACTIVE_LIMIT){const seen=new Set(),seenOptions=new Set();let valid=true;for(const slot of st.active){const q=question(mid,slot),k=textKey(q),ok=optionKey(q);if(!k||!ok||seen.has(k)||seenOptions.has(ok)){valid=false;break}seen.add(k);seenOptions.add(ok)}")
          s=s.replace("questionCount:active.length,meta:{databaseBank:true,engine:'v17-local-first',noRepeat:true,fullUnique:true,short:45,long:5,naturalStem:true}",
                      "questionCount:active.length,meta:{databaseBank:true,engine:'v18-distinct-25',noRepeat:true,fullUnique:true,uniqueOptions:true,short:22,long:3,naturalStem:true}")
          s=s.replace("'50 soal baru aktif tanpa duplikasi stem.'","'25 soal baru aktif. Stem dan set opsi tidak diulang.'")
          s=s.replace("Generate 50 soal baru?","Generate 25 soal baru?")
          s=s.replace("engine:'v17-local-first'","engine:'v18-distinct-25'")
          p.write_text(s)

          i=Path('index.html'); x=i.read_text(); old='2026.08.21.2310'; new='2026.08.21.2355';x=x.replace(old,new)
          x=x.replace('<option value="25">25 soal</option><option value="50" selected>50 soal</option><option value="all">Semua soal terpilih</option>',
                      '<option value="10">10 soal</option><option value="25" selected>25 soal</option><option value="all">Semua soal terpilih</option>').replace('<option value="10">10 soal</option><option value="10">10 soal</option>','<option value="10">10 soal</option>')
          i.write_text(x)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/v14-db-bank.js index.html version.json
          git diff --cached --quiet || git commit -m "Switch every module to 25 genuinely distinct questions"
          git push
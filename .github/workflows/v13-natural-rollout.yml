name: V13 natural question rollout
on:
  push:
    paths:
      - '.github/workflows/v13-natural-rollout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.21.1724'; new='2026.08.21.1740'
          p=Path('index.html'); s=p.read_text().replace(old,new).replace('js/v12-db-bank.js','js/v13-db-bank.js'); p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Activate natural-language V13 question engine"
          git push
name: Patch staged NUPMK quality loader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v22-nupmk.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v19-staging
          fetch-depth: 0
      - name: Insert NUPMK quality and source dedupe layers into staging
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          q='<script src="js/v22-nupmk-quality.js?v=2026.08.21.2405"></script>'
          if 'v22-nupmk-quality.js' not in s:
              base='<script src="js/v16-source-variants.js?v=2026.08.21.2405"></script>'
              s=s.replace(base,base+'\n  '+q)
          if 'v23-source-dedupe.js' not in s:
              s=s.replace(q,q+'\n  <script src="js/v23-source-dedupe.js?v=2026.08.21.2405"></script>')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load source-bank dedupe before HOTS selector" || true
          git push origin HEAD:v19-staging
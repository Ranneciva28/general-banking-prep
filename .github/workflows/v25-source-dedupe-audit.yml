name: V25 source dedupe audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v25-source-dedupe-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source roots, default 25, and replacement 25
        run: |
          cat > /tmp/audit-v25-source.js <<'NODE'
          const storage={};
          global.window={QUESTION_BANK:[]};
          global.localStorage={getItem:k=>storage[k]??null,setItem:(k,v)=>storage[k]=String(v),removeItem:k=>delete storage[k]};
          global.sessionStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};
          global.crypto=require('crypto').webcrypto;
          global.document={addEventListener:()=>{},querySelector:()=>null,querySelectorAll:()=>[],getElementById:()=>null,referrer:'',createElement:()=>({})};
          global.location={reload(){},pathname:'/'};global.navigator={userAgent:'audit',language:'id-ID'};global.screen={width:1440,height:900};global.confirm=()=>true;
          global.fetch=async(url,init={})=>{let b={};try{b=JSON.parse(init.body||'{}')}catch(e){}return{ok:true,text:async()=>'',json:async()=>({accepted_count:Number(b.p_requested_count)||25,accepted_slots:(b.p_questions||[]).map(x=>x.slot)})}};
          require(process.cwd()+'/js/questions.js');
          require(process.cwd()+'/js/material-bank-core.js');
          require(process.cwd()+'/js/material-bank-d1.js');
          require(process.cwd()+'/js/material-bank-d2.js');
          require(process.cwd()+'/js/material-bank-d3.js');
          require(process.cwd()+'/js/material-bank-d4d5.js');
          require(process.cwd()+'/js/material-bank-extra.js');
          require(process.cwd()+'/js/bridge-module.js');require(process.cwd()+'/js/bridge-category.js');require(process.cwd()+'/js/nupmk-modules.js');require(process.cwd()+'/js/v23-quality-bank.js');
          const source=window.__GBP_SOURCE_BANK__||[];let fail=false;
          for(let mid=1;mid<=35;mid++){
            const r=source.filter(q=>Number(q.moduleId)===mid),roots=new Set(r.map(q=>String(q.rootQuestionId||q.baseId||q.id)));
            console.log(`SOURCE M${String(mid).padStart(2,'0')} rows=${r.length} roots=${roots.size}`);
            if(r.length<50||roots.size<50)fail=true;
          }
          if(fail){console.error('SOURCE_50_FAIL');process.exit(1)}
          window.QUESTION_BANK.splice(0,window.QUESTION_BANK.length,...source);require(process.cwd()+'/js/v14-db-bank.js');const api=window.GBPDatabaseQuestionBank;
          for(let mid=1;mid<=35;mid++){
            const r=window.QUESTION_BANK.filter(q=>Number(q.moduleId)===mid);let near=0;for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++)if(api.nearDuplicate(r[i],r[j],.84))near++;
            console.log(`DEFAULT M${String(mid).padStart(2,'0')} count=${r.length} near=${near}`);if(r.length!==25||near)fail=true;
          }
          if(fail){console.error('DEFAULT_FAIL');process.exit(1)}
          (async()=>{
            for(let mid=1;mid<=35;mid++){
              await api.ensureModule(mid);const old=window.QUESTION_BANK.filter(q=>Number(q.moduleId)===mid);await api.reserveNew(mid);const fresh=window.QUESTION_BANK.filter(q=>Number(q.moduleId)===mid);
              const roots=new Set(old.map(q=>String(q.rootQuestionId||q.baseId||q.id)));const overlap=fresh.filter(q=>roots.has(String(q.rootQuestionId||q.baseId||q.id))).length;let near=0;
              for(const q of fresh)for(const x of old)if(api.nearDuplicate(q,x,.84))near++;
              console.log(`REPLACE M${String(mid).padStart(2,'0')} count=${fresh.length} overlap=${overlap} nearOld=${near}`);if(fresh.length!==25||overlap||near)fail=true;
            }
            console.log(fail?'V25_SOURCE_AUDIT=FAIL':'V25_SOURCE_AUDIT=PASS');process.exit(fail?1:0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/audit-v25-source.js
      - name: Activate source-deduped bank
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          old='2026.08.22.0925';new='2026.08.22.0930'
          p=Path('index.html');s=p.read_text();needle=f'  <script src="js/material-bank-d4d5.js?v={old}"></script>\n'
          if 'material-bank-extra.js' not in s:s=s.replace(needle,needle+f'  <script src="js/material-bank-extra.js?v={new}"></script>\n')
          s=s.replace(old,new);p.write_text(s)
          c=Path('js/cache-control.js');c.write_text(c.read_text().replace('gbpCacheNotice-20260822-0925','gbpCacheNotice-20260822-0930'))
          Path('version.json').write_text(json.dumps({'build':new,'forceCacheReset':True},separators=(',',':')))
          PY
          node --check js/material-bank-extra.js
          node --check js/v23-quality-bank.js
          node --check js/v14-db-bank.js
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/cache-control.js version.json
          git commit -m "Activate source-level near-duplicate removal"
          git push
